# ===========================================
# Netlify 자동 배포 설정 파일
# ===========================================
# GitHub에 push하면 Netlify가 이 파일을 읽고 자동으로 빌드·배포함

[build]
  # 빌드 명령어:
  #   1) Pillow 라이브러리 설치 (이미지 자동 압축에 필요)
  #   2) build.py 실행 → 사이트 생성 + 이미지 자동 압축
  command = "pip install -r requirements.txt && python3 scripts/build.py"
  # 배포할 폴더 (생성된 정적 파일 위치)
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# ===== HTTP 헤더 (보안 + SEO) =====
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ===== 이미지 캐싱 (재방문 시 빠른 로딩) =====
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ===== 404 페이지 (선택사항) =====
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
